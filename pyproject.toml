[project]
name = "kipu"
version = "0.1.0"
description = "Kipu Pay corpus pseudonymization service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pymupdf>=1.25",
    "lxml>=5.3",
    "regex>=2024.11",
    "orjson>=3.10",
    "python-dotenv>=1.0",
    "openai>=3.42.0",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kipu"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
