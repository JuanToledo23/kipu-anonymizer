# fly.toml app configuration file generated for kipu-anonymizer on 2026-10-31T13:26:19-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kipu-anonymizer'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '9000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
